   <g id="text_1">
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(91.440438 189.846844)">Artificial stimulation</text>
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(97.888641 208.355187)">of candidate male</text>
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(81.458875 226.863531)">or female sensory cells</text>
   </g>
   <g id="text_2">
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(394.312328 189.846844)">Full connectome model</text>
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(414.823891 208.355187)">166,606 neurons</text>
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(390.560609 226.863531)">25.6 million connections</text>
   </g>
   <g id="text_3">
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(724.552047 189.846844)">Count spikes in</text>
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(708.918531 208.355187)">8 candidate P1 cells</text>
    <text style="fill: #20343b; font: 13px 'DejaVu Sans'" transform="translate(713.773219 226.863531)">linked to courtship</text>
   </g>
   <g id="text_4">
    <text style="fill: #20343b; font: 12px 'DejaVu Sans'; text-anchor: middle" x="387.072" y="342.86325" transform="rotate(-0 387.072 342.86325)">mAL intact</text>
   </g>
   <g id="text_5">
    <text style="fill: #187d70; font: 12px 'DejaVu Sans'" transform="translate(517.971563 334.320938)">mAL output</text>
    <text style="fill: #187d70; font: 12px 'DejaVu Sans'" transform="translate(529.755938 351.405562)">blocked</text>
   </g>
  </g>
  <g id="text_6">
   <text style="fill: #20343b; font: 700 21px 'DejaVu Sans'; text-anchor: start" x="50.688" y="33.696" transform="rotate(-0 50.688 33.696)">What did we change — and what did we measure?</text>
  </g>
  <g id="text_7">
   <text style="fill: #63747a; font: 11px 'DejaVu Sans'; text-anchor: start" x="50.688" y="60.6528" transform="rotate(-0 50.688 60.6528)">The same network and input signal were tested twice. Only mAL output transmission changed.</text>
  </g>
  <g id="text_8">
   <text style="fill: #63747a; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="50.688" y="106.272" transform="rotate(-0 50.688 106.272)">INPUT</text>
  </g>
  <g id="text_9">
   <text style="fill: #63747a; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="364.032" y="106.272" transform="rotate(-0 364.032 106.272)">INTERVENTION</text>
  </g>
  <g id="text_10">
   <text style="fill: #63747a; font: 700 10px 'DejaVu Sans'; text-anchor: start" x="677.376" y="106.272" transform="rotate(-0 677.376 106.272)">MEASUREMENT</text>
  </g>
  <g id="text_11">
   <text style="fill: #63747a; font: 11px 'DejaVu Sans'" transform="translate(50.688 290.086187)">Matched inputs in each pair.</text>
   <text style="fill: #63747a; font: 11px 'DejaVu Sans'" transform="translate(50.688 305.747094)">No direct stimulation of P1</text>
   <text style="fill: #63747a; font: 11px 'DejaVu Sans'" transform="translate(50.688 321.408)">in this sensory experiment.</text>
  </g>
  <g id="text_12">
   <text style="fill: #187d70; font: 700 12px 'DejaVu Sans'" transform="translate(677.376 287.23875)">Male-cue response:</text>
   <text style="fill: #187d70; font: 700 12px 'DejaVu Sans'" transform="translate(677.376 304.323375)">0 spikes → 1–7 spikes</text>
   <text style="fill: #187d70; font: 700 12px 'DejaVu Sans'" transform="translate(677.376 321.408)">across the final checks.</text>
  </g>
  <g id="text_13">
   <text style="fill: #20343b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="50.688" y="425.088" transform="rotate(-0 50.688 425.088)">What this supports</text>
  </g>
  <g id="text_14">
   <text style="fill: #20343b; font: 12px 'DejaVu Sans'" transform="translate(50.688 447.795187)">Removing an inhibitory brake can reveal</text>
   <text style="fill: #20343b; font: 12px 'DejaVu Sans'" transform="translate(50.688 463.968)">a previously suppressed male-cue response.</text>
  </g>
  <g id="text_15">
   <text style="fill: #20343b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="506.88" y="425.088" transform="rotate(-0 506.88 425.088)">What it does not establish</text>
  </g>
  <g id="text_16">
   <text style="fill: #20343b; font: 12px 'DejaVu Sans'" transform="translate(506.88 447.795187)">A fly choosing males over females.</text>
   <text style="fill: #20343b; font: 12px 'DejaVu Sans'" transform="translate(506.88 463.968)">Female-cue responses remained stronger.</text>
  </g>
  <g id="text_17">
   <text style="fill: #63747a; font: 9px 'DejaVu Sans'; text-anchor: start" x="50.688" y="495.072" transform="rotate(-0 50.688 495.072)">Schematic, not an anatomical pathway map. Candidate identities, relay signs and neuron dynamics are modeled assumptions; see RESULTS.md.</text>
  </g>
 </g>
